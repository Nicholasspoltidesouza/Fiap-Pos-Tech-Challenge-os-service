services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: os_service_db
      POSTGRES_USER: os_user
      POSTGRES_PASSWORD: os_password
    ports:
      - "5433:5432"
    volumes:
      - os_pg_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  os-service:
    build: .
    profiles: ["app"]
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: os_service_db
      POSTGRES_USER: os_user
      POSTGRES_PASSWORD: os_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      SECURITY_PERMIT_ALL: "true"
    depends_on:
      - postgres
      - rabbitmq

volumes:
  os_pg_data:
