name: CI/CD - OS Service

on:
  push:
    branches: [ main, homolog ]
  pull_request:
    branches: [ main, homolog ]

jobs:
  build-and-test:
    name: Build, Test & JaCoCo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and verify (tests + JaCoCo 80%)
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: SonarQube Scan (optional soft)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            mvn -B sonar:sonar \
              -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
              -Dsonar.host.url=${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
          else
            echo "SONAR_TOKEN not set — skipping Sonar (soft gate)"
          fi

  docker-image:
    name: Build Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: os-service:latest
          outputs: type=docker,dest=/tmp/os-service.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-service-image
          path: /tmp/os-service.tar

  deploy-k8s:
    name: Deploy to kind (kubectl apply)
    needs: docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: os-service-image
          path: /tmp

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: os-service-ci

      - name: Load image into kind
        run: kind load image-archive /tmp/os-service.tar --name os-service-ci

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/02-secret.yaml
          kubectl apply -f k8s/03-postgres.yaml
          kubectl apply -f k8s/04-rabbitmq.yaml
          kubectl apply -f k8s/05-deployment.yaml
          kubectl apply -f k8s/06-service.yaml

      - name: Wait for rollout
        run: |
          kubectl -n oficina-os rollout status deployment/os-postgres --timeout=180s || true
          kubectl -n oficina-os rollout status deployment/os-rabbitmq --timeout=180s || true
          kubectl -n oficina-os rollout status deployment/os-service --timeout=240s || true
          kubectl -n oficina-os get pods,svc
