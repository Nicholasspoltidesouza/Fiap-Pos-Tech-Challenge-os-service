apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-rabbitmq
  namespace: oficina-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-rabbitmq
  template:
    metadata:
      labels:
        app: os-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: os-service-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: os-service-secret
                  key: RABBITMQ_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: os-rabbitmq
  namespace: oficina-os
spec:
  selector:
    app: os-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
